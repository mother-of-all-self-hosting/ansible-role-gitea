---
- name: Verify Gitea
  hosts: all
  become: true
  gather_facts: false

  vars:
    gitea_verify_username: molecule
    gitea_verify_password: Molecule-Verify-P4ss
    gitea_verify_repository: molecule-verify

  tasks:
    - name: Run the shared Gitea verification
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"
