---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: gitea-${MOLECULE_DISTRO:-ubuntu2604}-postgres-valkey
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        gitea_debug_service_enabled: false

        # Variables for Gitea
        gitea_uid: 1000
        gitea_gid: 1000
        gitea_scheme: http
        gitea_hostname: localhost
        gitea_container_labels_traefik_enabled: false
        gitea_container_http_host_bind_port: 3000

        # Variables required for Gitea to connect to the Postgres database (via Unix socket)
        gitea_database_type: postgres
        gitea_database_postgres_username: my_database_username
        gitea_database_postgres_password: my_database_password
        gitea_database_name: gitea
        gitea_database_postgres_socket_enabled: true
        gitea_database_postgres_socket_path_host: "{{ postgres_run_path }}"
        gitea_systemd_required_services_list_auto: |
          {{
            (['postgres.service'])
          }}

        # Variables required for Gitea to connect to the Valkey data-store
        gitea_config_cache_adapter: redis
        gitea_cache_redis_socket_path_host: "{{ valkey_run_path }}"
        gitea_systemd_required_services_list_custom:
          - "{{ valkey_identifier }}.service"

        # Variables for Postgres
        postgres_uid: 1000
        postgres_gid: 1000
        postgres_connection_password: postgres_password
        postgres_container_unix_socket_enabled: true
        postgres_managed_databases: |
          {{
            [{
              'name': gitea_database_name,
              'username': gitea_database_postgres_username,
              'password': gitea_database_postgres_password,
            }]
          }}

        # Variables for Valkey
        valkey_uid: 1000
        valkey_gid: 1000
        valkey_arch: amd64
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-postgres
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
