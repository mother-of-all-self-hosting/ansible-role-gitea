---
- name: Verify Gitea
  hosts: all
  become: true
  gather_facts: false

  vars:
    gitea_verify_username: molecule
    gitea_verify_password: Molecule-Verify-P4ss
    gitea_verify_repository: molecule-verify

    gitea_verify_units:
      - gitea.service
      - mariadb.service

  tasks:
    - name: Verify that Gitea works
      block:
        - name: Run the shared Gitea verification
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Gitea systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=gitea.service
          register: gitea_service_log
          changed_when: false

        - name: Show the Gitea systemd service log
          ansible.builtin.debug:
            var: gitea_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Gitea verification failed. The systemd service log is printed above."
